# Builds and publishes a release when a vX.Y.Z tag is pushed (scripts/release.mjs).
# The installer, its update signature and latest.json are attached to a public
# GitHub release; installed copies find it through
# https://github.com/Focusniks/NetTrace-desktop/releases/latest/download/latest.json
#
# Three jobs keep the update signing key away from the build:
#   preflight     — tag on main, versions match, the secret exists;
#   build         — tests and the NSIS installer, with no secrets at all
#                   (no dependency build script can read the key);
#   sign-publish  — signs the finished installer in one step, writes
#                   latest.json, uploads a draft, checks it and publishes.
# The release stays a draft until every asset is uploaded and verified, so
# "latest" never points at a broken release.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# bash (with -e) so a failing command in a multi-line step fails the step.
defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on any other branch could carry a modified workflow.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG does not point to a commit on main"
            exit 1
          fi

      - name: Check that the tag matches the app version and has release notes
        run: |
          node scripts/release-ci.mjs check "$TAG"
          node scripts/release-ci.mjs notes "$TAG" release-notes.md

      - name: Check the signing key secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Secrets TAURI_SIGNING_PRIVATE_KEY / _PASSWORD are not set (see docs/RELEASING.md)"
            exit 1
          fi

  build:
    name: Build installer (no secrets)
    needs: preflight
    runs-on: windows-latest
    outputs:
      installer: ${{ steps.installer.outputs.name }}
      sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # No dependency install scripts: nothing in the build needs them.
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      # Type check + vite build, before cargo (the app embeds dist/).
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Tests
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          node --test "scripts/*.test.mjs"
          npm --prefix apps/desktop test

      # The release config disables updater artifacts: the installer is
      # signed in the next job, so no key is needed (or present) here.
      - name: Build the installer
        working-directory: apps/desktop
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json

      - name: Locate the installer
        id: installer
        run: |
          name="NetTrace_${TAG#v}_x64-setup.exe"
          path="target/release/bundle/nsis/$name"
          test -f "$path"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: target/release/bundle/nsis/${{ steps.installer.outputs.name }}
          if-no-files-found: error
          retention-days: 1

  sign-publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INSTALLER: ${{ needs.build.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Only the lockfile-pinned Tauri CLI is used (for `signer sign`).
      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release

      - name: Check the installer is the one that was built
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  release/$INSTALLER" | sha256sum -c -

      # The only step that sees the key. The signature binds the version
      # (the app sets requireSignedVersion).
      - name: Sign the installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --no-install tauri signer sign --app-version "${TAG#v}" "../../release/$INSTALLER"

      - name: Write and check latest.json
        run: |
          node scripts/release-ci.mjs notes "$TAG" release-notes.md
          node scripts/release-ci.mjs latest "$TAG" "release/$INSTALLER" release-notes.md release/latest.json
          node scripts/release-ci.mjs manifest "$TAG" release

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=("release/$INSTALLER" "release/$INSTALLER.sig" release/latest.json)
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            # A re-run: replace the assets of our draft, never of a published release.
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; its assets are left untouched"
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          elif ! grep -qi "release not found" <<<"$draft"; then
            echo "::error::Cannot read release $TAG: $draft"
            exit 1
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "NetTrace $TAG" --notes-file release-notes.md "${files[@]}"
          fi

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for name in latest.json "$INSTALLER" "$INSTALLER.sig"; do
            if ! grep -qxF "$name" <<<"$assets"; then
              echo "::error::Release asset $name is missing; the draft is left unpublished"
              exit 1
            fi
          done
          # Check what was actually uploaded, not the local files.
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --pattern "*.sig" --dir verify
          node scripts/release-ci.mjs manifest "$TAG" verify
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
