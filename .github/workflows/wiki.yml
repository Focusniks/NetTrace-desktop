# Keeps the GitHub wiki in step with docs/: every wiki page is generated by
# scripts/wiki-sync.mjs from the same Markdown the documentation site is built
# from. Edit docs/, never the wiki.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/wiki-sync.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

# The wiki repository is written with the workflow token.
permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the wiki pages and push them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          # The wiki repository exists only after its first page was created on github.com.
          if ! git clone --quiet --depth 1 "$remote" wiki; then
            echo "::warning::The wiki has no pages yet: create the first one on github.com, then re-run this workflow"
            exit 0
          fi
          node scripts/wiki-sync.mjs wiki
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Sync with docs at ${GITHUB_SHA::7}"
          git push --quiet
